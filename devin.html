<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devin | Profil</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
            color: white;

            background: #070711;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            overflow-x: hidden;
        }

        /* Leuchtende Hintergründe */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            background: #5b5bf7;

            filter: blur(180px);

            opacity: 0.25;

            top: -200px;
            left: -150px;

            z-index: -1;
        }

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            background: #a855f7;

            filter: blur(180px);

            opacity: 0.2;

            bottom: -200px;
            right: -150px;

            z-index: -1;
        }

        /* Profil */

        .profile {
            width: 100%;
            max-width: 650px;

            padding: 35px;

            text-align: center;

            border-radius: 30px;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5);

            animation: appear 0.7s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Bild */

        .profile-image {
            width: 280px;
            height: 280px;

            max-width: 80vw;
            max-height: 80vw;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid rgba(255,255,255,0.2);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.6);

            transition: 0.4s;
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(2deg);

            box-shadow:
                0 25px 70px rgba(120,120,255,0.4);
        }

        /* Name */

        h1 {
            font-size: 50px;

            margin:
                25px 0 5px;
        }

        .subtitle {
            color: #aaa;

            font-size: 18px;

            margin-bottom: 30px;
        }

        /* Info */

        .info {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 25px;
        }

        .info-box {
            padding: 18px 10px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .info-box strong {
            display: block;

            font-size: 22px;

            margin-bottom: 5px;
        }

        .info-box span {
            color: #888;

            font-size: 13px;
        }

        /* Zurück */

        .back {
            display: inline-block;

            margin-top: 30px;

            padding: 14px 28px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.1);

            border:
                1px solid rgba(255,255,255,0.1);

            color: white;

            text-decoration: none;

            font-size: 16px;

            transition: 0.25s;
        }

        .back:hover {
            transform: translateY(-3px);

            background:
                rgba(255,255,255,0.2);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);
        }

        /* Handy */

        @media (max-width: 600px) {

            .profile {
                padding: 25px 18px;
            }

            h1 {
                font-size: 40px;
            }

            .info {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <main class="profile">

        <img
            class="profile-image"
            src="devin.png"
            alt="devin"
        >

        <h1>Alp</h1>

        <div class="subtitle">
            👤 Mitglied der Crew
        </div>


        <div class="info">

            <div class="info-box">
                <strong>🔥</strong>
                <span>Aktiv</span>
            </div>

            <div class="info-box">
                <strong>⭐</strong>
                <span>Pro gooner</span>
            </div>

            <div class="info-box">
                <strong>💎</strong>
                <span>Starke Aura</span>
            </div>

        </div>


        <a
            class="back"
            href="index.html"
        >
            ← Zurück zur Crew
        </a>

    </main>

</body>
</html>

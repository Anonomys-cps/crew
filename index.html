<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unsere Crew</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(91,91,247,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(168,85,247,.16),
            transparent 30%
        ),
        #070711;

    overflow: hidden;
}


/* ==================== */
/* HINTERGRUND */
/* ==================== */

body::before {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    background: #5b5bf7;

    filter: blur(180px);

    opacity: .20;

    top: -250px;
    left: -200px;

    z-index: -1;

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    background: #a855f7;

    filter: blur(180px);

    opacity: .18;

    bottom: -250px;
    right: -200px;

    z-index: -1;

    pointer-events: none;
}


/* ==================== */
/* HEADER */
/* ==================== */

header {
    text-align: center;

    padding: 5vh 20px 2vh;
}

header h1 {
    margin: 0;

    font-size: clamp(42px, 5vw, 65px);

    font-weight: 800;

    letter-spacing: -2px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #aaaaff,
        #ffffff
    );

    background-size: 200%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: shine 5s linear infinite;
}

header p {
    margin: 12px 0 0;

    color: #888;

    font-size: 16px;

    letter-spacing: .5px;
}

@keyframes shine {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 200%;
    }

}


/* ==================== */
/* SUCHE */
/* ==================== */

.search {
    display: block;

    width: min(90%, 520px);

    margin: 2vh auto 3vh;

    padding: 15px 20px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.055);

    backdrop-filter: blur(20px);

    color: white;

    font-size: 16px;

    outline: none;

    transition: .3s;
}

.search::placeholder {
    color: #777;
}

.search:focus {
    border-color: #7777ff;

    background: rgba(255,255,255,.08);

    box-shadow:
        0 0 30px rgba(91,91,247,.15);
}


/* ==================== */
/* KARTEN */
/* ==================== */

.cards {
    width: min(94%, 1150px);

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;
}


.card {
    position: relative;

    overflow: hidden;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.11);

    backdrop-filter: blur(18px);

    cursor: pointer;

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        border-color .4s,
        box-shadow .4s;

    animation: appear .7s ease both;
}

.card:nth-child(1) {
    animation-delay: .05s;
}

.card:nth-child(2) {
    animation-delay: .12s;
}

.card:nth-child(3) {
    animation-delay: .19s;
}

.card:nth-child(4) {
    animation-delay: .26s;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


.card:hover {

    transform:
        translateY(-10px)
        scale(1.015);

    border-color:
        rgba(140,140,255,.5);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 35px rgba(91,91,247,.12);
}


.card img {

    width: 100%;

    height: 280px;

    object-fit: cover;

    display: block;

    transition:
        transform .6s cubic-bezier(.2,.8,.2,1),
        filter .4s;
}

.card:hover img {

    transform: scale(1.08);

    filter:
        brightness(1.08)
        contrast(1.03);
}


.card::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    top: 150px;
    bottom: 0;

    background:
        linear-gradient(
            transparent,
            rgba(7,7,17,.8)
        );

    pointer-events: none;
}


/* ==================== */
/* INFO */
/* ==================== */

.info {

    position: relative;

    z-index: 2;

    padding: 19px 21px 21px;

    margin-top: -5px;
}

.info h2 {

    margin: 0;

    font-size: 27px;

    letter-spacing: -.5px;
}

.info p {

    margin: 7px 0 0;

    color: #8d8d9d;

    font-size: 14px;

    transition: .3s;
}

.card:hover .info p {
    color: #aaaaff;
}


/* ==================== */
/* FOOTER */
/* ==================== */

footer {

    position: absolute;

    bottom: 15px;

    left: 0;
    right: 0;

    text-align: center;

    color: #555;

    font-size: 12px;

    letter-spacing: .5px;
}


/* ==================== */
/* RGB FT. DANIEL */
/* ==================== */

.rgb-text {

    display: inline-block;

    margin-left: 8px;

    font-weight: 800;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff00ff,
        #0000ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
    );

    background-size: 400% 400%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: rgbMove 3s linear infinite;

    text-shadow:
        0 0 15px rgba(255,0,255,.25);
}

@keyframes rgbMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* ==================== */
/* TABLET */
/* ==================== */

@media (max-width: 850px) {

    .cards {

        width: 92%;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .card img {

        height: 31vh;

        min-height: 190px;
    }

    .info {
        padding: 13px;
    }

    .info h2 {
        font-size: 21px;
    }

    .info p {
        font-size: 11px;
    }
}


/* ==================== */
/* HANDY */
/* ==================== */

@media (max-width: 600px) {

    header {
        padding-top: 3vh;
    }

    header h1 {
        font-size: 39px;
    }

    header p {
        font-size: 13px;
        margin-top: 8px;
    }

    .search {

        margin-top: 2vh;

        margin-bottom: 2vh;

        padding: 12px 16px;
    }

    .cards {

        width: 92%;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;
    }

    .card {
        border-radius: 16px;
    }

    .card img {

        height: 34vh;

        min-height: 180px;
    }

    .info {
        padding: 9px;
    }

    .info h2 {
        font-size: 17px;
    }

    .info p {
        font-size: 9px;
    }

    footer {
        bottom: 8px;
        font-size: 9px;
    }

    .rgb-text {
        margin-left: 4px;
    }
}


/* ==================== */
/* KLEINE DISPLAYS */
/* ==================== */

@media (max-height: 650px) {

    header {
        padding-top: 2vh;
    }

    header h1 {
        font-size: 35px;
    }

    header p {
        margin-top: 5px;
    }

    .search {

        margin-top: 1vh;

        margin-bottom: 1.5vh;

        padding: 10px 15px;
    }

    .card img {

        height: 28vh;

        min-height: 150px;
    }

}

</style>
</head>


<body>


<!-- ==================== -->
<!-- HEADER -->
<!-- ==================== -->

<header>

    <h1>Unsere Crew</h1>

    <p>
        Willkommen auf unserer Website 👋
    </p>

</header>


<!-- ==================== -->
<!-- SUCHE -->
<!-- ==================== -->

<input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Person suchen..."
>


<!-- ==================== -->
<!-- CREW -->
<!-- ==================== -->

<div class="cards">


    <!-- ALP -->

    <div
        class="card"
        data-name="alp"
        onclick="location.href='alp.html'"
    >

        <img
            src="alp.png"
            alt="Alp"
        >

        <div class="info">

            <h2>Alp</h2>

            <p>
                Profil ansehen →
            </p>

        </div>

    </div>


    <!-- DEVIN -->

    <div
        class="card"
        data-name="devin"
        onclick="location.href='devin.html'"
    >

        <img
            src="devin.png"
            alt="Devin"
        >

        <div class="info">

            <h2>Devin</h2>

            <p>
                Profil ansehen →
            </p>

        </div>

    </div>


    <!-- BILAL -->

    <div
        class="card"
        data-name="bilal"
        onclick="location.href='bilal.html'"
    >

        <img
            src="bilal.png"
            alt="Bilal"
        >

        <div class="info">

            <h2>Bilal</h2>

            <p>
                Profil ansehen →
            </p>

        </div>

    </div>


    <!-- ABI -->

    <div
        class="card"
        data-name="abi"
        onclick="location.href='abi.html'"
    >

        <img
            src="abi.png"
            alt="Abi"
        >

        <div class="info">

            <h2>Abi</h2>

            <p>
                Profil ansehen →
            </p>

        </div>

    </div>


</div>


<!-- ==================== -->
<!-- FOOTER -->
<!-- ==================== -->

<footer>

    Unsere Crew © 2026

    <span class="rgb-text">
        ft. daniel
    </span>

</footer>


<!-- ==================== -->
<!-- SUCHE SCRIPT -->
<!-- ==================== -->

<script>

const search =
    document.getElementById("search");

const cards =
    document.querySelectorAll(".card");


search.addEventListener("input", () => {

    const value =
        search.value
        .toLowerCase()
        .trim();


    cards.forEach(card => {

        const name =
            card.dataset.name;


        if (name.includes(value)) {

            card.style.display = "";

        } else {

            card.style.display = "none";

        }

    });

});

</script>


</body>
</html>
